[package]
name = "beankeeper"
version = "0.8.0"
edition = "2024"
rust-version = "1.91"
description = "Idiomatic, ergonomic library of primitives for professional double-entry accounting"
authors = ["Roland <roland@govcraft.ai>"]
license = "MIT OR Apache-2.0"
keywords = ["accounting", "double-entry", "bookkeeping", "finance", "ledger"]
repository = "https://github.com/Govcraft/beankeeper"
categories = ["finance"]
readme = "../README.md"
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
chrono = { version = "0.4.44", default-features = false }
data-encoding = { version = "2.10.0", default-features = false, features = ["alloc"] }
num-bigint = "0.5.1"
rusqlite = { version = "0.39.0", default-features = false, optional = true }
schemars = { version = "1.2.3", default-features = false, features = ["std"] }
serde = { version = "1.0.229", optional = true }
sha2 = { version = "0.10.9", default-features = false }

[lints]
workspace = true

[features]
serde = ["dep:serde"]
rusqlite = ["dep:rusqlite"]
