name: Release

on:
  push:
    tags:
      - "beankeeper-cli-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate release tag and binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag and changelog before building
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/check-release.sh --metadata-only --tag "$RELEASE_TAG"
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for offline packaging tests
        run: cargo fetch --locked
      - name: Test offline release preflight
        run: python3 -B -m unittest discover -s scripts/tests -v
      - uses: Swatinem/rust-cache@v2
      - name: Build preflight binary
        run: cargo build --locked -p beankeeper-cli
      - name: Check built binary version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/check-release.sh --tag "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set cross-compile env (aarch64-linux)
        if: matrix.cross
        run: |
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
          } >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p beankeeper-cli

      - name: Determine version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#beankeeper-cli-v}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          BIN_NAME="bk"
          ARCHIVE_NAME="bk-${VERSION}-${TARGET}"

          mkdir -p "staging/${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/${BIN_NAME}" "staging/${ARCHIVE_NAME}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "staging/${ARCHIVE_NAME}/"

          cd staging
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          echo "ASSET=staging/${ARCHIVE_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bk-${{ matrix.target }}
          path: ${{ env.ASSET }}

  # Automatic CLI tags create the GitHub release and update AUR only.
  # Library publishes to crates.io are a separate, explicit decision.
  # This job is retained so the publish script and Trusted Publishing
  # wiring stay in tree, but it does not run on tag push.
  # Agents must never cargo publish or publish with a token.
  publish-crates:
    name: Publish library to crates.io
    needs: build
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate with crates.io using OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      # Only the library is published; the CLI (publish = false) ships as GitHub
      # Release binaries. An already-published library version is skipped.
      - name: Publish library unless its version is already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 -B scripts/publish_crate.py beankeeper

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#beankeeper-cli-v}" >> "$GITHUB_OUTPUT"

      - name: Collect archives
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        working-directory: release
        run: sha256sum -- *.tar.gz > checksums-sha256.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release artifacts with Sigstore
        working-directory: release
        run: |
          for artifact in *.tar.gz checksums-sha256.txt; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore" "$artifact"
          done

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/*.tar.gz
            release/checksums-sha256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: bk v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/checksums-sha256.txt
            release/*.sigstore

  aur:
    name: Update AUR package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Determine version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#beankeeper-cli-v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -sL "https://github.com/Govcraft/beankeeper/releases/download/beankeeper-cli-v${VERSION}/checksums-sha256.txt" -o checksums.txt
          SHA_X86=$(grep x86_64-unknown-linux-gnu checksums.txt | awk '{print $1}')
          SHA_ARM=$(grep aarch64-unknown-linux-gnu checksums.txt | awk '{print $1}')
          echo "SHA256_X86_64=${SHA_X86}" >> "$GITHUB_ENV"
          echo "SHA256_AARCH64=${SHA_ARM}" >> "$GITHUB_ENV"

      - name: Configure SSH for AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
          EOF

      - name: Clone and update AUR package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone ssh://aur@aur.archlinux.org/bk-bin.git aur-pkg
          cd aur-pkg

          T=$(printf '\t')

          cat > PKGBUILD <<PKGBUILD_EOF
          # Maintainer: Roland Rodriguez <roland@govcraft.ai>
          pkgname=bk-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Double-entry accounting on the command line — SQLCipher-encrypted, multi-tenant"
          arch=('x86_64' 'aarch64')
          url="https://github.com/Govcraft/beankeeper"
          license=('MIT' 'Apache-2.0')
          provides=('bk')
          conflicts=('bk')

          source_x86_64=("\${url}/releases/download/beankeeper-cli-v\${pkgver}/bk-\${pkgver}-x86_64-unknown-linux-gnu.tar.gz")
          source_aarch64=("\${url}/releases/download/beankeeper-cli-v\${pkgver}/bk-\${pkgver}-aarch64-unknown-linux-gnu.tar.gz")
          sha256sums_x86_64=('${SHA256_X86_64}')
          sha256sums_aarch64=('${SHA256_AARCH64}')

          package() {
              install -Dm755 "bk-\${pkgver}-\${CARCH}-unknown-linux-gnu/bk" "\${pkgdir}/usr/bin/bk"
              install -Dm644 "bk-\${pkgver}-\${CARCH}-unknown-linux-gnu/LICENSE-MIT" "\${pkgdir}/usr/share/licenses/bk-bin/LICENSE-MIT"
              install -Dm644 "bk-\${pkgver}-\${CARCH}-unknown-linux-gnu/LICENSE-APACHE" "\${pkgdir}/usr/share/licenses/bk-bin/LICENSE-APACHE"
          }
          PKGBUILD_EOF

          cat > .SRCINFO <<SRCINFO_EOF
          pkgbase = bk-bin
          ${T}pkgdesc = Double-entry accounting on the command line — SQLCipher-encrypted, multi-tenant
          ${T}pkgver = ${VERSION}
          ${T}pkgrel = 1
          ${T}url = https://github.com/Govcraft/beankeeper
          ${T}arch = x86_64
          ${T}arch = aarch64
          ${T}license = MIT
          ${T}license = Apache-2.0
          ${T}provides = bk
          ${T}conflicts = bk
          ${T}source_x86_64 = https://github.com/Govcraft/beankeeper/releases/download/beankeeper-cli-v${VERSION}/bk-${VERSION}-x86_64-unknown-linux-gnu.tar.gz
          ${T}sha256sums_x86_64 = ${SHA256_X86_64}
          ${T}source_aarch64 = https://github.com/Govcraft/beankeeper/releases/download/beankeeper-cli-v${VERSION}/bk-${VERSION}-aarch64-unknown-linux-gnu.tar.gz
          ${T}sha256sums_aarch64 = ${SHA256_AARCH64}

          pkgname = bk-bin
          SRCINFO_EOF

          git config user.name "Roland Rodriguez"
          git config user.email "roland@govcraft.ai"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${VERSION}"
          git push origin master
