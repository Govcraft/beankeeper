name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Include the base parent of the PR merge commit for version comparison.
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch dependencies for offline packaging tests
        run: cargo fetch --locked
      - name: Test offline release preflight
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Check changelog and release metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            base_manifest="$RUNNER_TEMP/beankeeper-cli-base.toml"
            git show "${BASE_SHA}:beankeeper-cli/Cargo.toml" > "$base_manifest"
            scripts/check-release.sh --metadata-only --base-manifest "$base_manifest"
          else
            scripts/check-release.sh --metadata-only
          fi

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace and test targets for warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace including documentation
        run: cargo test --workspace --locked

  publish-dry-run:
    name: Verify crates.io packages (no upload)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the library is publishable; Cargo skips beankeeper-cli (publish = false).
      - name: Dry-run library publishing
        run: cargo publish --dry-run --workspace --locked
